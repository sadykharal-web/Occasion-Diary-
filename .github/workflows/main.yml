name: Build Life Line APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configure Android SDK and licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_ROOT" ]; then
            SDK_ROOT="$HOME/android-sdk"
          fi
          mkdir -p "$SDK_ROOT/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$SDK_ROOT/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK_ROOT/licenses/android-sdk-preview-license"

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name "sdkmanager" -type f 2>/dev/null | head -n 1 || true)
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager || true)
          fi
          if [ -n "$SDKMANAGER" ]; then
            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36.1" "build-tools;36.0.0" || true
            set -o pipefail
          fi
          echo "Installed platforms:"
          ls -la "$SDK_ROOT/platforms" || true
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              tr -d ' \r\n' < debug.keystore.base64 | base64 -d > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore -storepass android \
                -alias androiddebugkey -keypass android -keyalg RSA \
                -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          ls -lh debug.keystore

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle --version
          if ! gradle :app:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --console=plain \
            -Dorg.gradle.workers.max=2 \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8 -Djava.awt.headless=true" \
            2>&1 | tee gradle-build.log; then
            echo "### Gradle Build Failure" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 80 gradle-build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            ERR_TAIL=$(grep -E "^(e: |> Task .* FAILED|FAILURE:|\* What went wrong:|What went wrong:|Caused by:|Execution failed)" gradle-build.log | tail -n 15 | tr '\n' ' ')
            if [ -z "$ERR_TAIL" ]; then
              ERR_TAIL=$(tail -n 20 gradle-build.log | tr '\n' ' ')
            fi
            echo "::error::Gradle assembleDebug failed: $ERR_TAIL"
            exit 1
          fi

      - name: Upload Build Failure Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: ignore

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Life-Line-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Run unit tests
        run: |
          set -o pipefail
          if ! gradle :app:testDebugUnitTest \
            --tests "com.example.LedgerLogicTest" \
            --tests "com.example.ExampleUnitTest" \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --console=plain \
            -Dorg.gradle.workers.max=2 \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8 -Djava.awt.headless=true" \
            2>&1 | tee gradle-test.log; then
            echo "### Unit Test Failure" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 80 gradle-test.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            ERR_TAIL=$(grep -E "^(e: |> Task .* FAILED|FAILURE:|\* What went wrong:|What went wrong:|Caused by:|Execution failed)" gradle-test.log | tail -n 15 | tr '\n' ' ')
            echo "::error::Unit tests failed: $ERR_TAIL"
            exit 1
          fi
